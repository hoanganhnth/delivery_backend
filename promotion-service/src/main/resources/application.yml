server:
  port: 8096

app:
  internal:
    secret: ${internal-secret:${INTERNAL_SECRET:}}
  promotion:
    checkout-enabled: ${PROMOTION_CHECKOUT_ENABLED:false}
    merchant-create-api-enabled: ${PROMOTION_MERCHANT_CREATE_API_ENABLED:false}

spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: promotion-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/promotion_db
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.delivery.promotion_service: ${APP_LOG_LEVEL:INFO}
    org.springframework.kafka: INFO

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: livenessState
      show-details: never
      show-components: never
