spring.application.name=order-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.port=8084
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}
app.order.payment-event-processing-enabled=${ORDER_PAYMENT_EVENT_PROCESSING_ENABLED:false}
restaurant.service.url=${RESTAURANT_SERVICE_URL:http://restaurant-service}
promotion.service.url=${PROMOTION_SERVICE_URL:http://promotion-service:8096}
flashsale.service.url=${FLASHSALE_SERVICE_URL:http://flashsale-service:8092}
app.checkout.reservation-timeout-ms=${CHECKOUT_RESERVATION_TIMEOUT_MS:2000}
app.order.voucher-checkout-enabled=${ORDER_VOUCHER_CHECKOUT_ENABLED:false}
app.order.flashsale-checkout-enabled=${ORDER_FLASHSALE_CHECKOUT_ENABLED:false}
app.resilience.restaurant.timeout-ms=${ORDER_RESTAURANT_TIMEOUT_MS:2000}
app.resilience.restaurant.failure-rate-threshold=${ORDER_RESTAURANT_FAILURE_RATE_THRESHOLD:50}
app.resilience.restaurant.sliding-window-size=${ORDER_RESTAURANT_SLIDING_WINDOW_SIZE:20}
app.resilience.restaurant.wait-open-seconds=${ORDER_RESTAURANT_WAIT_OPEN_SECONDS:30}
app.resilience.restaurant.permitted-half-open-calls=${ORDER_RESTAURANT_HALF_OPEN_CALLS:5}

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Transactional outbox relay
app.outbox.relay-enabled=${ORDER_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${ORDER_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${ORDER_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${ORDER_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${ORDER_OUTBOX_MAX_ATTEMPTS:10}

# Security logging (for debugging)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ✅ Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# Kafka Consumer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Canonical input topics with isolated-recovery overrides.
app.kafka.input-topics.restaurant-confirmed=${ORDER_INPUT_RESTAURANT_CONFIRMED_TOPIC:restaurant.order-confirmed}
app.kafka.input-topics.restaurant-rejected=${ORDER_INPUT_RESTAURANT_REJECTED_TOPIC:restaurant.order-rejected}
app.kafka.input-topics.saga-update-order-status=${ORDER_INPUT_SAGA_UPDATE_STATUS_TOPIC:saga.command.update-order-status}
app.kafka.topics.order-created=${ORDER_CREATED_TOPIC:order.created}
app.kafka.topics.order-cancelled=${ORDER_CANCELLED_TOPIC:order.cancelled}
app.kafka.topics.refund-eligible=${ORDER_REFUND_ELIGIBLE_TOPIC:order.refund-eligible}
app.kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.initial-delay-ms=${KAFKA_RETRY_INITIAL_DELAY_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${KAFKA_RETRY_MAX_DELAY_MS:10000}
app.kafka.retry.auto-create-topics=${KAFKA_RETRY_AUTO_CREATE_TOPICS:false}

# Logging
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka=ERROR
