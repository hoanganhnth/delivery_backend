spring.application.name=order-service
server.port=8084
app.internal.secret=${INTERNAL_SECRET:}
app.order.payment-event-processing-enabled=${ORDER_PAYMENT_EVENT_PROCESSING_ENABLED:false}
restaurant.service.url=${RESTAURANT_SERVICE_URL}

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Transactional outbox relay
app.outbox.relay-enabled=${ORDER_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${ORDER_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${ORDER_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${ORDER_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${ORDER_OUTBOX_MAX_ATTEMPTS:10}

# Security logging (for debugging)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ✅ Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# Kafka Consumer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Canonical input topics with isolated-recovery overrides.
app.kafka.input-topics.restaurant-confirmed=${ORDER_INPUT_RESTAURANT_CONFIRMED_TOPIC:restaurant.order-confirmed}
app.kafka.input-topics.restaurant-rejected=${ORDER_INPUT_RESTAURANT_REJECTED_TOPIC:restaurant.order-rejected}
app.kafka.input-topics.saga-update-order-status=${ORDER_INPUT_SAGA_UPDATE_STATUS_TOPIC:saga.command.update-order-status}
app.kafka.topics.order-created=${ORDER_CREATED_TOPIC:order.created}
app.kafka.topics.order-cancelled=${ORDER_CANCELLED_TOPIC:order.cancelled}

# Logging
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka=ERROR
