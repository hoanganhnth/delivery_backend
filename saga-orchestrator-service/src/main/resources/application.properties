server.port=8095
spring.application.name=saga-orchestrator-service
matching.initial.max-retry-attempts=${MATCHING_INITIAL_MAX_RETRY_ATTEMPTS:10}
matching.initial.delay-seconds=${MATCHING_INITIAL_DELAY_SECONDS:30}
matching.initial.max-delay-seconds=${MATCHING_INITIAL_MAX_DELAY_SECONDS:300}
matching.initial.backoff-multiplier=${MATCHING_INITIAL_BACKOFF_MULTIPLIER:1.5}

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/saga_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.outbox.relay-enabled=${SAGA_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${SAGA_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${SAGA_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${SAGA_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${SAGA_OUTBOX_MAX_ATTEMPTS:10}

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=saga-orchestrator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Canonical input topics with isolated-recovery overrides.
app.kafka.input-topics.order-created=${SAGA_INPUT_ORDER_CREATED_TOPIC:order.created}
app.kafka.input-topics.order-cancelled=${SAGA_INPUT_ORDER_CANCELLED_TOPIC:order.cancelled}
app.kafka.input-topics.restaurant-confirmed=${SAGA_INPUT_RESTAURANT_CONFIRMED_TOPIC:restaurant.order-confirmed}
app.kafka.input-topics.delivery-created=${SAGA_INPUT_DELIVERY_CREATED_TOPIC:delivery.created.result}
app.kafka.input-topics.shipper-accepted=${SAGA_INPUT_SHIPPER_ACCEPTED_TOPIC:delivery.shipper-accepted}
app.kafka.input-topics.delivery-status=${SAGA_INPUT_DELIVERY_STATUS_TOPIC:delivery.status-updated}
app.kafka.input-topics.shipper-rejected=${SAGA_INPUT_SHIPPER_REJECTED_TOPIC:delivery.shipper-rejected}
app.kafka.input-topics.shipper-found=${SAGA_INPUT_SHIPPER_FOUND_TOPIC:shipper.found}
app.kafka.input-topics.shipper-not-found=${SAGA_INPUT_SHIPPER_NOT_FOUND_TOPIC:shipper.not-found}
app.kafka.input-topics.delivery-created-failed=${SAGA_INPUT_DELIVERY_CREATED_FAILED_TOPIC:delivery.created.failed}
app.kafka.input-topics.delivery-cancel-failed=${SAGA_INPUT_DELIVERY_CANCEL_FAILED_TOPIC:delivery.cancel.failed}

# Canonical production topics with isolated-recovery overrides.
app.kafka.topics.create-delivery=${SAGA_CREATE_DELIVERY_COMMAND_TOPIC:saga.command.create-delivery}
app.kafka.topics.cancel-delivery=${SAGA_CANCEL_DELIVERY_COMMAND_TOPIC:saga.command.cancel-delivery}
app.kafka.topics.find-shipper=${SAGA_FIND_SHIPPER_COMMAND_TOPIC:saga.command.find-shipper}
app.kafka.topics.cache-shipper-found=${SAGA_CACHE_SHIPPER_FOUND_COMMAND_TOPIC:saga.command.cache-shipper-found}
app.kafka.topics.expire-shipper-offer=${SAGA_EXPIRE_OFFER_COMMAND_TOPIC:saga.command.expire-shipper-offer}
app.kafka.topics.mark-shipper-not-found=${SAGA_MARK_SHIPPER_NOT_FOUND_COMMAND_TOPIC:saga.command.mark-shipper-not-found}
app.kafka.topics.stop-matching=${SAGA_STOP_MATCHING_COMMAND_TOPIC:saga.command.stop-matching}
app.kafka.topics.update-order-status=${SAGA_UPDATE_ORDER_STATUS_COMMAND_TOPIC:saga.command.update-order-status}

# Logging
logging.level.com.delivery.saga_orchestrator_service=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=WARN
