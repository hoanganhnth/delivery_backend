global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: delivery-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9090
          - auth-service:9090
          - user-service:9090
          - order-service:9090
          - restaurant-service:9090
          - delivery-service:9090
          - match-service:9090
          - settlement-service:9090
          - saga-orchestrator-service:9090
          - notification-service:9090
          - shipper-service:9090
          - tracking-service:9090
          - promotion-service:9090
