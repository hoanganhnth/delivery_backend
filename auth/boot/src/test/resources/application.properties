# Test-only bootstrap: keep Spring contexts independent from Config Server and
# Eureka. Production bootstrap remains in src/main/resources.
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.task.scheduling.enabled=false
app.internal.secret=test-internal-secret
user-service.url=${USER_SERVICE_URL:http://user-service:8082}
user-service.internal-secret=${INTERNAL_SECRET:test-internal-secret}
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.security-email.from=test@example.invalid
app.security-email.password-reset-url=http://localhost:3000/reset-password
app.security-email.verification-url=http://localhost:3000/verify-email
