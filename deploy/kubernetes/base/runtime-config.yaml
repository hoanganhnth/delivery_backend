apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-runtime
  labels:
    app.kubernetes.io/part-of: delivery-platform
    delivery.platform/template: provider-neutral
    delivery.platform/wave: control
data:
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888,optional:configtree:/run/secrets/
  CONFIG_SERVER_FAIL_FAST: "true"
  SERVICE_DISCOVERY_ENABLED: "true"
  EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.example.invalid:9092
  SPRING_DATA_REDIS_HOST: redis.example.invalid
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_ELASTICSEARCH_URIS: http://search.example.invalid:9200
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.example.invalid:4318/v1/traces
  TRACING_SAMPLE_PROBABILITY: "1.0"
  APP_CORS_ALLOWED_ORIGINS: https://replace-me.example.invalid
  RATE_LIMIT_TRUSTED_PROXY: "false"
  RATE_LIMIT_TRUSTED_PROXY_CIDRS: ""
  # Identity migration flags deliberately have a service-specific control key.
  # Deployments map these keys to the application variables below, so one
  # capability can be enabled without accidentally switching every consumer.
  AUTH_IDENTITY_EVENTS_ENABLED: "false"
  AUTH_IDENTITY_OUTBOX_RELAY_ENABLED: "false"
  AUTH_IDENTITY_STATUS_BOOTSTRAP_ENABLED: "false"
  AUTH_PUBLIC_REGISTRATION_ENABLED: "false"
  # With the master switch on, 0 keeps registration closed except for the
  # allowlist held in the optional Auth-only secret. Use 1..99 only with that
  # secret's HMAC key; use 100 only after the staged canary gates pass.
  AUTH_PUBLIC_REGISTRATION_CANARY_PERCENTAGE: "0"
  # R5 issuer-only compatibility switch. Do not set PRINCIPAL_ID until the
  # deployed HTTP/WebSocket explicit-claim audit and Track A health gate pass.
  # R4 service-local legacy fallback drains are independent of this switch.
  AUTH_JWT_ACCESS_TOKEN_SUBJECT_MODE: "LEGACY_USER_ID"
  USER_IDENTITY_EVENTS_ENABLED: "false"
  USER_IDENTITY_OUTBOX_RELAY_ENABLED: "false"
  SHIPPER_IDENTITY_EVENTS_ENABLED: "false"
  SHIPPER_IDENTITY_OUTBOX_RELAY_ENABLED: "false"
  DELIVERY_SHIPPER_IDENTITY_PROJECTION_ENFORCED: "false"
  TRACKING_SHIPPER_IDENTITY_PROJECTION_ENFORCED: "false"
  RESTAURANT_PRINCIPAL_OWNERSHIP_ENFORCED: "false"
  ORDER_PRINCIPAL_OWNERSHIP_ENFORCED: "false"
  NOTIFICATION_PRINCIPAL_OWNERSHIP_ENFORCED: "false"
  NOTIFICATION_PREFERENCES_ENABLED: "false"
  SETTLEMENT_PRINCIPAL_OWNERSHIP_ENFORCED: "false"
  PROMOTION_PRINCIPAL_OWNERSHIP_ENFORCED: "false"
  FLASHSALE_PRINCIPAL_OWNERSHIP_ENFORCED: "false"
  ORDER_PAYMENT_EVENT_PROCESSING_ENABLED: "false"
  ORDER_VOUCHER_CHECKOUT_ENABLED: "false"
  ORDER_FLASHSALE_CHECKOUT_ENABLED: "false"
  ORDER_SERVICEABILITY_ENFORCEMENT_ENABLED: "false"
  ORDER_ETA_WINDOW_ENABLED: "false"
  ORDER_INVENTORY_RESERVATION_ENABLED: "false"
  RESTAURANT_SERVICEABILITY_ENABLED: "false"
  RESTAURANT_INVENTORY_ENABLED: "false"
  RESTAURANT_INVENTORY_CONSUMER_ENABLED: "false"
  # Compatibility first: require quote/key only after every checkout client is rolled out.
  ORDER_QUOTE_ENFORCEMENT_ENABLED: "false"
  ORDER_QUOTE_TTL: "PT5M"
  ORDER_QUOTE_CLEANUP_RETENTION: "PT24H"
  ORDER_QUOTE_CLEANUP_DELAY_MS: "3600000"
  PAYMENT_PROCESSING_ENABLED: "false"
  PAYMENT_CLIENT_API_ENABLED: "false"
  FAKE_PAYMENT_PROVIDER_ENABLED: "false"
  PAYOUT_PROCESSING_ENABLED: "false"
  SETTLEMENT_SELF_SERVICE_API_ENABLED: "false"
  SETTLEMENT_ADMIN_MUTATION_API_ENABLED: "false"
  REFUND_PROVIDER_PROCESSING_ENABLED: "false"
  REFUND_PROCESSING_ENABLED: "false"
  SETTLEMENT_DELIVERY_EXCEPTION_PROCESSING_ENABLED: "false"
  REFUND_OUTBOX_RELAY_ENABLED: "false"
  PROMOTION_CHECKOUT_ENABLED: "false"
  PROMOTION_OUTBOX_RELAY_ENABLED: "false"
  PROMOTION_MERCHANT_CREATE_API_ENABLED: "false"
  FLASHSALE_CHECKOUT_ENABLED: "false"
  FLASHSALE_OUTBOX_RELAY_ENABLED: "false"
  FLASHSALE_MERCHANT_REGISTRATION_ENABLED: "false"
  ANALYTICS_PROCESSING_ENABLED: "false"
  LIVESTREAM_API_ENABLED: "false"
  # Production Matching v1 remains dark until PostgreSQL/Redis invariants,
  # staging smoke and client capability rollout gates are explicitly passed.
  ORDER_VOUCHER_STACKING_ENABLED: "false"
  ORDER_VOUCHER_STACKING_CANARY_PRINCIPALS: ""
  PROMOTION_STACKING_ENABLED: "false"
  PROMOTION_STACKING_CANARY_PRINCIPALS: ""
  MATCHING_H3_ENABLED: "false"
  MATCHING_BATCH_ENABLED: "false"
  MATCHING_BATCH_SCHEDULER_ENABLED: "false"
  MATCHING_BATCH_CLIENT_CAPABILITY_ENABLED: "false"
  DELIVERY_BATCH_ENABLED: "false"
  BATCH_OFFER_ENABLED: "false"
  DELIVERY_POD_ENABLED: "false"
  DELIVERY_POD_STORAGE_PROVIDER: ""
  DELIVERY_EXCEPTION_ENABLED: "false"
