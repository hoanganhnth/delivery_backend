{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "shipper-service",
    "labels": {
      "app.kubernetes.io/name": "shipper-service",
      "app.kubernetes.io/part-of": "delivery-platform",
      "app.kubernetes.io/component": "application",
      "delivery.platform/template": "provider-neutral",
      "delivery.platform/wave": "resources"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 5,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxUnavailable": 0,
        "maxSurge": 1
      }
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "shipper-service"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "shipper-service",
          "app.kubernetes.io/part-of": "delivery-platform",
          "app.kubernetes.io/component": "application",
          "delivery.platform/template": "provider-neutral",
          "delivery.platform/wave": "resources"
        }
      },
      "spec": {
        "serviceAccountName": "shipper-service",
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 90,
        "securityContext": {
          "fsGroup": 10001,
          "fsGroupChangePolicy": "OnRootMismatch",
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "shipper-service",
            "image": "registry.example.invalid/delivery/shipper-service:REPLACE_ME",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8089,
                "protocol": "TCP"
              },
              {
                "name": "management",
                "containerPort": 9090,
                "protocol": "TCP"
              }
            ],
            "env": [
              {
                "name": "MANAGEMENT_SERVER_PORT",
                "value": "9090"
              },
              {
                "name": "JAVA_TOOL_OPTIONS",
                "value": "-Xms128m -Xmx384m -Djava.io.tmpdir=/tmp"
              },
              {
                "name": "DATABASE_HOST",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "delivery-data-plane",
                    "key": "DATABASE_HOST"
                  }
                }
              },
              {
                "name": "DATABASE_PORT",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "delivery-data-plane",
                    "key": "DATABASE_PORT"
                  }
                }
              },
              {
                "name": "SPRING_DATASOURCE_URL",
                "value": "jdbc:postgresql://$(DATABASE_HOST):$(DATABASE_PORT)/shipper_db"
              },
              {
                "name": "PLATFORM_SECRETS_INTERNAL_SECRET_REQUIRED",
                "value": "true"
              },
              {
                "name": "IDENTITY_EVENTS_ENABLED",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "delivery-runtime",
                    "key": "SHIPPER_IDENTITY_EVENTS_ENABLED"
                  }
                }
              },
              {
                "name": "SHIPPER_IDENTITY_OUTBOX_RELAY_ENABLED",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "delivery-runtime",
                    "key": "SHIPPER_IDENTITY_OUTBOX_RELAY_ENABLED"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "runtime-secrets",
                "mountPath": "/run/secrets",
                "readOnly": true
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true,
              "runAsUser": 10001,
              "runAsGroup": 10001
            },
            "startupProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": "management"
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 36
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": "management"
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": "management"
              },
              "periodSeconds": 15,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            },
            "envFrom": [
              {
                "configMapRef": {
                  "name": "delivery-runtime"
                }
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          },
          {
            "name": "runtime-secrets",
            "projected": {
              "defaultMode": 288,
              "sources": [
                {
                  "secret": {
                    "name": "delivery-shared-internal",
                    "items": [
                      {
                        "key": "value",
                        "path": "internal-secret"
                      }
                    ]
                  }
                },
                {
                  "secret": {
                    "name": "delivery-shipper-service-db",
                    "items": [
                      {
                        "key": "username",
                        "path": "spring.datasource.username"
                      },
                      {
                        "key": "password",
                        "path": "spring.datasource.password"
                      }
                    ]
                  }
                }
              ]
            }
          }
        ]
      }
    }
  }
}
