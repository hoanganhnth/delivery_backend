spring.application.name=simulator-service
server.port=${SIMULATOR_SERVER_PORT:8100}

# This service is deliberately disabled unless an explicit test/dev flag is set.
simulator.enabled=${SIMULATOR_ENABLED:false}
simulator.api-token=${SIMULATOR_API_TOKEN:}
simulator.gateway-base-url=${SIMULATOR_GATEWAY_BASE_URL:http://localhost:8079}
simulator.allow-non-local-targets=${SIMULATOR_ALLOW_NON_LOCAL_TARGETS:false}
simulator.allowed-origins=${SIMULATOR_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4174,http://127.0.0.1:4174}
simulator.allowed-gateway-hosts=${SIMULATOR_ALLOWED_GATEWAY_HOSTS:localhost,127.0.0.1,api-gateway}
simulator.poll-interval-millis=${SIMULATOR_POLL_INTERVAL_MS:1000}
simulator.human-order-timeout-seconds=${SIMULATOR_HUMAN_ORDER_TIMEOUT_SECONDS:300}
simulator.run-timeout-seconds=${SIMULATOR_RUN_TIMEOUT_SECONDS:900}
simulator.max-shippers=${SIMULATOR_MAX_SHIPPERS:50}
simulator.max-concurrent-runs=${SIMULATOR_MAX_CONCURRENT_RUNS:4}

management.server.port=${MANAGEMENT_SERVER_PORT:9100}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}

logging.level.org.apache.http=ERROR
