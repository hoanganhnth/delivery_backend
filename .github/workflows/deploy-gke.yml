name: CI/CD Pipeline (Test, Lint, Build & Deploy to GKE)

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (e.g. api-gateway, auth-service, or "all")'
        required: false
        default: 'api-gateway'

permissions:
  contents: read

env:
  PROJECT_ID: lithe-paratext-506208-s5
  GAR_LOCATION: asia-southeast1
  GKE_CLUSTER: delivery-cluster
  GKE_ZONE: asia-southeast1-a
  REPOSITORY: delivery-repo

jobs:
  # =========================================================================
  # STAGE 1: QUALITY GATE (Lint, Secret Scan, Tests & Coverage)
  # Chạy kiểm tra chất lượng code giống như GitLab CI
  # Nếu bất kỳ bước nào FAILED -> Dừng toàn bộ pipeline, KHÔNG cho deploy
  # =========================================================================
  quality-gate:
    name: "Stage 1: Lint, Test & Quality Gates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20 (for Contract Validation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Secret Scan (Security Lint)
        run: |
          bash scripts/verify-secrets.sh

      - name: Verify API & HTTP Boundary Contracts
        run: |
          ./scripts/verify-http-api-inventory.sh
          node docs/platform/system/api/generate-http-contract.mjs --check

      - name: Run Unit & Integration Tests (with JaCoCo Coverage)
        run: |
          mvn -B test-compile
          mvn -B test -Dtest="*Test" -DfailIfNoTests=false

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-coverage-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore

  # =========================================================================
  # STAGE 2: MONOREPO CHANGE DETECTION
  # Chỉ chạy sau khi Stage 1 (Quality Gate) PASS thành công
  # =========================================================================
  detect-changes:
    name: "Stage 2: Detect Monorepo Changes"
    needs: quality-gate
    # Chỉ deploy khi code được PUSH vào staging/main (hoặc manual trigger), không deploy trên Pull Request
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
              - 'deploy/kubernetes/overlays/gke/api-gateway.yaml'
              - 'runtime-platform-starter/**'
              - 'observability-starter/**'
            auth-service:
              - 'auth/**'
              - 'auth-resource-server-starter/**'
              - 'identity-contracts/**'
            user-service:
              - 'user/**'
              - 'identity-contracts/**'
            order-service:
              - 'order/**'
              - 'order-contracts/**'
            restaurant-service:
              - 'restaurant/**'
            delivery-service:
              - 'delivery/**'
              - 'delivery-contracts/**'
            shipper-service:
              - 'shipper/**'
              - 'identity-contracts/**'
            notification-service:
              - 'notification/**'
            tracking-service:
              - 'tracking/**'
            routing-service:
              - 'routing/**'
              - 'routing-contracts/**'
            search-service:
              - 'search/**'
              - 'search-contracts/**'
            config-server:
              - 'config-server/**'
            discovery-server:
              - 'discovery-server/**'

      - name: Determine Target Services
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.service }}" = "all" ]; then
              echo 'matrix=["api-gateway","auth-service","user-service","order-service","restaurant-service","delivery-service"]' >> $GITHUB_OUTPUT
            else
              echo 'matrix=["${{ inputs.service }}"]' >> $GITHUB_OUTPUT
            fi
          else
            echo "matrix=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # STAGE 3: BUILD, CONTAINERIZE & DEPLOY TO GKE
  # Chỉ deploy các service đã vượt qua kiểm tra và có thay đổi code
  # =========================================================================
  build-and-deploy:
    name: "Stage 3: Build & Deploy (${{ matrix.service }})"
    needs: [quality-gate, detect-changes]
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Package Service Jar
        run: |
          bash scripts/package-compose-services.sh ${{ matrix.service }}

      - name: Determine Service Path and Build Image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          canonical="${SERVICE%-service}"
          if [ "$SERVICE" = "saga-orchestrator-service" ]; then
            canonical="dispatch"
          fi

          if [ -f "${canonical}/boot/pom.xml" ] && [ -d "${canonical}/boot/src" ]; then
            SERVICE_PATH="${canonical}/boot"
          elif [ -f "${SERVICE}/pom.xml" ] && [ -d "${SERVICE}/src" ]; then
            SERVICE_PATH="${SERVICE}"
          else
            SERVICE_PATH="${SERVICE}"
          fi

          echo "Building Docker image for service ${SERVICE} with path ${SERVICE_PATH}"
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE}"

          docker build --build-arg SERVICE_PATH="${SERVICE_PATH}" \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" .

          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy to GKE
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE}:${IMAGE_TAG}"

          # Áp dụng K8s overlay nếu có cho service này
          if [ -f "deploy/kubernetes/overlays/gke/${SERVICE}.yaml" ]; then
            kubectl apply -f "deploy/kubernetes/overlays/gke/${SERVICE}.yaml"
            kubectl set image "deployment/${SERVICE}" "${SERVICE}=${IMAGE_URI}" -n delivery || true
            
            # Kiểm tra nếu cụm đang scale về 0 node (để tiết kiệm chi phí)
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l || echo "0")
            if [ "$NODE_COUNT" -eq 0 ]; then
              echo "⚠️ Cụm GKE đang ở 0 node (tắt để tiết kiệm chi phí)."
              echo "✅ Manifest & Image đã được nạp sẵn vào Kubernetes Control Plane."
              echo "👉 Khi bạn chạy lệnh bật lại 2 node, Kubernetes sẽ tự động kéo Image và khởi động Pods!"
            else
              kubectl rollout status "deployment/${SERVICE}" -n delivery --timeout=240s
            fi
          else
            echo "No custom GKE overlay at deploy/kubernetes/overlays/gke/${SERVICE}.yaml yet. Image pushed to registry: ${IMAGE_URI}"
          fi
