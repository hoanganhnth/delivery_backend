name: CI/CD Pipeline

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (e.g. api-gateway, auth-service, or "all")'
        required: false
        default: 'api-gateway'

permissions:
  contents: read

# =============================================================================
# STAGE 1: Quality Gate (từ CI tập trung)
# =============================================================================
jobs:
  quality-gate:
    name: "Quality Gate"
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/quality-java.yml@main
    with:
      run_secret_scan: true
      run_contract_check: true
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  # ===========================================================================
  # STAGE 2: Detect Changed Services (monorepo)
  # ===========================================================================
  detect-changes:
    name: "Detect Changes"
    needs: quality-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
              - 'runtime-platform-starter/**'
              - 'observability-starter/**'
            auth-service:
              - 'auth/**'
              - 'auth-resource-server-starter/**'
              - 'identity-contracts/**'
            user-service:
              - 'user/**'
              - 'identity-contracts/**'
            order-service:
              - 'order/**'
              - 'order-contracts/**'
            restaurant-service:
              - 'restaurant/**'
            delivery-service:
              - 'delivery/**'
              - 'delivery-contracts/**'
            shipper-service:
              - 'shipper/**'
              - 'identity-contracts/**'
            notification-service:
              - 'notification/**'
            tracking-service:
              - 'tracking/**'
            routing-service:
              - 'routing/**'
              - 'routing-contracts/**'
            search-service:
              - 'search/**'
              - 'search-contracts/**'
            config-server:
              - 'config-server/**'
            discovery-server:
              - 'discovery-server/**'

      - name: Determine Target Services
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.service }}" = "all" ]; then
              echo 'matrix=["api-gateway","auth-service","user-service","order-service","restaurant-service","delivery-service"]' >> $GITHUB_OUTPUT
            else
              echo 'matrix=["${{ inputs.service }}"]' >> $GITHUB_OUTPUT
            fi
          else
            echo "matrix=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # STAGE 3: Build & Push (từ CI tập trung)
  # CI chỉ build image → push GAR. Không deploy, không update gitops-cd.
  # ArgoCD Image Updater sẽ tự poll GAR → cập nhật tag → ArgoCD sync.
  # ===========================================================================
  build:
    name: "Build (${{ matrix.service }})"
    needs: [quality-gate, detect-changes]
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-java.yml@main
    with:
      service_name: ${{ matrix.service }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
