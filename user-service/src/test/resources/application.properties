# Test-only bootstrap; provisioning tests use H2 and mocked internal clients.
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.task.scheduling.enabled=false
app.internal.secret=test-internal-secret
auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}
auth-service.internal-secret=${INTERNAL_SECRET:test-internal-secret}
