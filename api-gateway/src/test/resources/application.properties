# Keep the Gateway test context independent from a running Config Server.
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.task.scheduling.enabled=false
app.auth-service.uri=http://auth-service
app.user-service.uri=http://user-service
app.restaurant-service.uri=http://restaurant-service
app.order-service.uri=http://order-service
app.delivery-service.uri=http://delivery-service
app.search-service.uri=http://search-service
app.shipper-service.uri=http://shipper-service
app.notification-service.uri=http://notification-service
app.tracking-service.uri=http://tracking-service
app.tracking-service.ws-uri=ws://tracking-service
app.livestream-service.uri=http://livestream-service
app.settlement-service.uri=http://settlement-service
app.promotion-service.uri=http://promotion-service
app.analytics-service.uri=http://analytics-service
app.flashsale-service.uri=http://flashsale-service
