# Tắt kiểm tra compatibility giữa Spring Boot & Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

# Cổng cho gateway
server.port=8079
spring.application.name=api-gateway
# Runtime configuration is centralized when CONFIG_SERVER_IMPORT is required
# (Compose/staging/production). The optional direct-run default keeps focused
# JVM tests hermetic; it is never used by deployment manifests.
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Management is bound to a separate, internal-only port. Compose does not publish it.
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Redis-backed fixed-window request limits use peer IP for every policy. Set
# RATE_LIMIT_TRUSTED_PROXY=true only when Gateway is behind a trusted proxy AND
# RATE_LIMIT_TRUSTED_PROXY_CIDRS explicitly lists its CIDRs. Then the first
# X-Forwarded-For client address is used. Values are per 60-second window and
# can be adjusted per environment without a code change.
gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
gateway.rate-limit.trusted-proxy=${RATE_LIMIT_TRUSTED_PROXY:false}
gateway.rate-limit.trusted-proxy-cidrs=${RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
gateway.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
gateway.rate-limit.redis-timeout-millis=${RATE_LIMIT_REDIS_TIMEOUT_MS:500}
gateway.rate-limit.public-auth.limit=${RATE_LIMIT_PUBLIC_AUTH:10}
gateway.rate-limit.public-auth.fail-open=${RATE_LIMIT_PUBLIC_AUTH_FAIL_OPEN:false}
gateway.rate-limit.public-catalog.limit=${RATE_LIMIT_PUBLIC_CATALOG:120}
gateway.rate-limit.public-catalog.fail-open=${RATE_LIMIT_PUBLIC_CATALOG_FAIL_OPEN:true}
gateway.rate-limit.authenticated-read.limit=${RATE_LIMIT_AUTHENTICATED_READ:300}
gateway.rate-limit.authenticated-read.fail-open=${RATE_LIMIT_AUTHENTICATED_READ_FAIL_OPEN:true}
gateway.rate-limit.mutation.limit=${RATE_LIMIT_MUTATION:30}
gateway.rate-limit.mutation.fail-open=${RATE_LIMIT_MUTATION_FAIL_OPEN:false}
gateway.rate-limit.websocket-connection.limit=${RATE_LIMIT_WEBSOCKET_CONNECTION:10}
gateway.rate-limit.websocket-connection.fail-open=${RATE_LIMIT_WEBSOCKET_CONNECTION_FAIL_OPEN:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cấu hình định tuyến cho AUTH-SERVICE
# spring.cloud.gateway.routes[0].id=auth-service
# spring.cloud.gateway.routes[0].uri=http://localhost:8081
# spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
# spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

# Cấu hình định tuyến cho USER-SERVICE
# spring.cloud.gateway.routes[1].id=user-service
# spring.cloud.gateway.routes[1].uri=http://localhost:8082
# spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
# spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

# Operational probes are isolated from the public Gateway listener. Compose
# keeps this port private; do not add an API Gateway route or host port for it.
# Customer payment traffic is a separate Gateway capability.
app.payment.client-api-enabled=${PAYMENT_CLIENT_API_ENABLED:false}
app.livestream.client-api-enabled=${LIVESTREAM_CLIENT_API_ENABLED:false}
