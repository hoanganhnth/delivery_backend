spring.application.name=restaurant-service

server.port=8083
app.internal.secret=${INTERNAL_SECRET:}
order.service.url=${ORDER_SERVICE_URL}
app.outbox.relay-enabled=${RESTAURANT_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${RESTAURANT_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${RESTAURANT_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${RESTAURANT_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${RESTAURANT_OUTBOX_MAX_ATTEMPTS:10}

# DataSource config
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=restaurant-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Producer: serialize event object → JSON (dùng cho SearchSync + Restaurant order events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topics.order-confirmed=${RESTAURANT_ORDER_CONFIRMED_TOPIC:restaurant.order-confirmed}
app.kafka.topics.order-rejected=${RESTAURANT_ORDER_REJECTED_TOPIC:restaurant.order-rejected}
