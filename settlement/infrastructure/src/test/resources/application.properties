spring.datasource.url=jdbc:h2:mem:settlement_infrastructure_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Test-only bootstrap for the persistence slice after production adapters move here.
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.task.scheduling.enabled=false
app.internal.secret=settlement-persistence-fixture-only
