# Service Configuration
spring.application.name=match-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
app.observability.kafka-observation-excluded-beans=locationKafkaListenerContainerFactory
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.port=8092

# External service URL used by COD eligibility checks.
settlement.service.url=${SETTLEMENT_SERVICE_URL:http://settlement-service}
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}
app.resilience.settlement.timeout-ms=${MATCH_SETTLEMENT_TIMEOUT_MS:2000}
app.resilience.settlement.failure-rate-threshold=${MATCH_SETTLEMENT_FAILURE_RATE_THRESHOLD:50}
app.resilience.settlement.sliding-window-size=${MATCH_SETTLEMENT_SLIDING_WINDOW_SIZE:20}
app.resilience.settlement.wait-open-seconds=${MATCH_SETTLEMENT_WAIT_OPEN_SECONDS:30}
app.resilience.settlement.permitted-half-open-calls=${MATCH_SETTLEMENT_HALF_OPEN_CALLS:5}
matching.candidate-pool-size=${MATCHING_CANDIDATE_POOL_SIZE:20}

# Durable Match command receipts and result outbox. Redis remains only the
# rebuildable GEO/offer/cancellation projection.
spring.datasource.url=jdbc:postgresql://localhost:5432/match_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.outbox.relay-enabled=${MATCH_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${MATCH_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${MATCH_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${MATCH_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${MATCH_OUTBOX_MAX_ATTEMPTS:10}
app.cancellation-projection.relay-enabled=${MATCH_CANCELLATION_PROJECTION_RELAY_ENABLED:true}
app.cancellation-projection.poll-delay-ms=${MATCH_CANCELLATION_PROJECTION_POLL_DELAY_MS:1000}
app.cancellation-projection.batch-size=${MATCH_CANCELLATION_PROJECTION_BATCH_SIZE:50}
# Retain the legacy all-listener switch, while allowing the stop fence to
# remain available when an operator deliberately pauses Find consumption.
match.kafka.listener.auto-startup=${MATCH_KAFKA_LISTENER_AUTO_STARTUP:true}
match.kafka.find-listener.auto-startup=${MATCH_KAFKA_FIND_LISTENER_AUTO_STARTUP:${match.kafka.listener.auto-startup}}
match.kafka.stop-listener.auto-startup=${MATCH_KAFKA_STOP_LISTENER_AUTO_STARTUP:${match.kafka.listener.auto-startup}}

# Redis Configuration (local replica cho shipper locations)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=${MATCH_REDIS_TIMEOUT:60000ms}
spring.data.redis.database=0

# ✅ Kafka Configuration for event-driven communication
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=match-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.use-type-info-headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Jackson Configuration for LocalDateTime
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Logging
logging.level.com.delivery.match_service=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web.reactive.function.client=${WEBCLIENT_LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka=ERROR
