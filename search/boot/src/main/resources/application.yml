server:
  port: 8088

spring:
  application:
    name: search-service
  config:
    import: ${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
  cloud:
    config:
      fail-fast: ${CONFIG_SERVER_FAIL_FAST:false}
      retry:
        initial-interval: 1000
        max-interval: 5000
        max-attempts: 12
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      auto-startup: ${SEARCH_KAFKA_LISTENER_AUTO_STARTUP:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    elasticsearch:
      repositories:
        enabled: ${APP_ELASTICSEARCH_ENABLED:false}

eureka:
  client:
    enabled: ${SERVICE_DISCOVERY_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}
    prefer-ip-address: false
    metadata-map:
      management.port: ${management.server.port}
      readiness-path: /actuator/health/readiness

app:
  search:
  elasticsearch:
    enabled: ${APP_ELASTICSEARCH_ENABLED:false}

management:
  health:
    elasticsearch:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: livenessState
      show-details: never
      show-components: never
