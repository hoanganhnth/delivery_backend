server.port=8092
spring.application.name=flashsale-service
app.internal.secret=${INTERNAL_SECRET:}
app.flashsale.checkout-enabled=${FLASHSALE_CHECKOUT_ENABLED:false}
app.flashsale.merchant-registration-enabled=${FLASHSALE_MERCHANT_REGISTRATION_ENABLED:false}
restaurant.service.url=${RESTAURANT_SERVICE_URL}

spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=flashsale-group
spring.kafka.consumer.auto-offset-reset=earliest
