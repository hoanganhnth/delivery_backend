# Service configuration
spring.application.name=tracking-service
server.port=8093
app.websocket.publisher.disconnect-grace-seconds=${TRACKING_PUBLISHER_DISCONNECT_GRACE_SECONDS:30}
app.websocket.publisher.lease-ttl-seconds=${TRACKING_PUBLISHER_LEASE_TTL_SECONDS:120}
app.websocket.publisher.expiry-sweep-interval-ms=${TRACKING_PUBLISHER_EXPIRY_SWEEP_INTERVAL_MS:5000}
app.websocket.publisher.expiry-sweep-batch-size=${TRACKING_PUBLISHER_EXPIRY_SWEEP_BATCH_SIZE:100}
app.websocket.publisher.expiry-claim-seconds=${TRACKING_PUBLISHER_EXPIRY_CLAIM_SECONDS:30}
app.internal.secret=${INTERNAL_SECRET:}
delivery.service.url=${DELIVERY_SERVICE_URL}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms
spring.data.redis.database=0

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.consumer.group-id=tracking-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# WebSocket Configuration
# WebSocket endpoint is exposed through api-gateway and requires Authorization.
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Logging
logging.level.com.delivery.tracking_service=${APP_LOG_LEVEL:INFO}
