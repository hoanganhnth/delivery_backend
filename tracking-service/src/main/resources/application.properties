# Service configuration
spring.application.name=tracking-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Location pings are deliberately not observed or exported; this keeps the
# high-rate raw WebSocket/Kafka path outside the order tracing budget.
spring.kafka.template.observation-enabled=false
spring.kafka.listener.observation-enabled=false
app.observability.kafka-observation-enabled=false
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.port=8093
spring.datasource.url=jdbc:postgresql://localhost:5432/tracking_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.websocket.publisher.disconnect-grace-seconds=${TRACKING_PUBLISHER_DISCONNECT_GRACE_SECONDS:30}
app.websocket.publisher.lease-ttl-seconds=${TRACKING_PUBLISHER_LEASE_TTL_SECONDS:120}
app.websocket.publisher.expiry-sweep-interval-ms=${TRACKING_PUBLISHER_EXPIRY_SWEEP_INTERVAL_MS:5000}
app.websocket.publisher.expiry-sweep-batch-size=${TRACKING_PUBLISHER_EXPIRY_SWEEP_BATCH_SIZE:100}
app.websocket.publisher.expiry-claim-seconds=${TRACKING_PUBLISHER_EXPIRY_CLAIM_SECONDS:30}
app.websocket.fanout.workers=${TRACKING_FANOUT_WORKERS:4}
app.websocket.fanout.executor-queue-capacity=${TRACKING_FANOUT_QUEUE_CAPACITY:1024}
app.websocket.redis-fanout-listener-enabled=${TRACKING_REDIS_FANOUT_LISTENER_ENABLED:true}
app.location-history.retention-days=${LOCATION_HISTORY_RETENTION_DAYS:90}
app.location-history.max-query-size=${LOCATION_HISTORY_MAX_QUERY_SIZE:500}
app.location-history.cleanup-cron=${LOCATION_HISTORY_CLEANUP_CRON:0 20 3 * * *}
app.kafka.groups.delivery-rooms=${TRACKING_DELIVERY_ROOM_GROUP_ID:${spring.application.name}-delivery-rooms-${HOSTNAME:${random.value}}}
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}
delivery.service.url=${DELIVERY_SERVICE_URL:http://delivery-service}
app.resilience.delivery.timeout-ms=${TRACKING_DELIVERY_TIMEOUT_MS:2000}
app.resilience.delivery.failure-rate-threshold=${TRACKING_DELIVERY_FAILURE_RATE_THRESHOLD:50}
app.resilience.delivery.sliding-window-size=${TRACKING_DELIVERY_SLIDING_WINDOW_SIZE:20}
app.resilience.delivery.wait-open-seconds=${TRACKING_DELIVERY_WAIT_OPEN_SECONDS:30}
app.resilience.delivery.permitted-half-open-calls=${TRACKING_DELIVERY_HALF_OPEN_CALLS:5}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms
spring.data.redis.database=0

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.consumer.group-id=tracking-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate

# WebSocket Configuration
# WebSocket endpoint is exposed through api-gateway and requires Authorization.
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Logging
logging.level.com.delivery.tracking_service=${APP_LOG_LEVEL:INFO}
