spring.application.name=simulator-service
server.port=${SIMULATOR_SERVER_PORT:8100}

# This service is deliberately disabled unless an explicit test/dev flag is set.
simulator.enabled=${SIMULATOR_ENABLED:false}
simulator.admin-only=${SIMULATOR_ADMIN_ONLY:true}
simulator.api-token=${SIMULATOR_API_TOKEN:}
simulator.gateway-base-url=${SIMULATOR_GATEWAY_BASE_URL:http://localhost:8079}
simulator.auth-base-url=${SIMULATOR_AUTH_BASE_URL:http://auth-service:8081}
simulator.delivery-base-url=${SIMULATOR_DELIVERY_BASE_URL:http://delivery-service:8085}
simulator.internal-secret=${internal-secret:${INTERNAL_SECRET:}}
simulator.managed-actor-pool-required=${SIMULATOR_MANAGED_ACTOR_POOL_REQUIRED:true}
simulator.allow-non-local-targets=${SIMULATOR_ALLOW_NON_LOCAL_TARGETS:false}
simulator.allowed-origins=${SIMULATOR_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4174,http://127.0.0.1:4174}
simulator.allowed-gateway-hosts=${SIMULATOR_ALLOWED_GATEWAY_HOSTS:localhost,127.0.0.1,api-gateway}
simulator.poll-interval-millis=${SIMULATOR_POLL_INTERVAL_MS:1000}
simulator.human-order-timeout-seconds=${SIMULATOR_HUMAN_ORDER_TIMEOUT_SECONDS:300}
simulator.run-timeout-seconds=${SIMULATOR_RUN_TIMEOUT_SECONDS:900}
simulator.max-shippers=${SIMULATOR_MAX_SHIPPERS:50}
simulator.max-orders-per-run=${SIMULATOR_MAX_ORDERS_PER_RUN:20}
simulator.max-concurrent-runs=${SIMULATOR_MAX_CONCURRENT_RUNS:4}
simulator.movement-tick-seconds=${SIMULATOR_MOVEMENT_TICK_SECONDS:5}
simulator.kafka-observer-enabled=${SIMULATOR_KAFKA_OBSERVER_ENABLED:false}
simulator.ledger-observer-enabled=${SIMULATOR_LEDGER_OBSERVER_ENABLED:false}
simulator.kafka-decision-trace-topic=${SIMULATOR_KAFKA_DECISION_TRACE_TOPIC:matching.decision-trace}
simulator.kafka-observer-group-id=${SIMULATOR_KAFKA_OBSERVER_GROUP_ID:simulator-algorithm-observer}

spring.kafka.bootstrap-servers=${SIMULATOR_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SIMULATOR_KAFKA_OBSERVER_GROUP_ID:simulator-algorithm-observer}
spring.kafka.consumer.auto-offset-reset=${SIMULATOR_KAFKA_AUTO_OFFSET_RESET:latest}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

management.server.port=${MANAGEMENT_SERVER_PORT:9100}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}

logging.level.org.apache.http=ERROR
