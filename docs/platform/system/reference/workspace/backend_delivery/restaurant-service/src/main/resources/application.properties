spring.application.name=restaurant-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

server.port=8083
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}
order.service.url=${ORDER_SERVICE_URL:http://order-service}
app.resilience.order.timeout-ms=${RESTAURANT_ORDER_TIMEOUT_MS:2000}
app.resilience.order.failure-rate-threshold=${RESTAURANT_ORDER_FAILURE_RATE_THRESHOLD:50}
app.resilience.order.sliding-window-size=${RESTAURANT_ORDER_SLIDING_WINDOW_SIZE:20}
app.resilience.order.wait-open-seconds=${RESTAURANT_ORDER_WAIT_OPEN_SECONDS:30}
app.resilience.order.permitted-half-open-calls=${RESTAURANT_ORDER_HALF_OPEN_CALLS:5}
app.outbox.relay-enabled=${RESTAURANT_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${RESTAURANT_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${RESTAURANT_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${RESTAURANT_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${RESTAURANT_OUTBOX_MAX_ATTEMPTS:10}
app.outbox.lease-seconds=${RESTAURANT_OUTBOX_LEASE_SECONDS:30}
spring.task.scheduling.pool.size=${RESTAURANT_SCHEDULER_POOL_SIZE:2}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s
app.identity.principal-ownership.enforced=${RESTAURANT_PRINCIPAL_OWNERSHIP_ENFORCED:false}
app.restaurant.serviceability-enabled=${RESTAURANT_SERVICEABILITY_ENABLED:false}
app.restaurant.inventory-enabled=${RESTAURANT_INVENTORY_ENABLED:false}
app.restaurant.inventory-reservation-ttl=${RESTAURANT_INVENTORY_RESERVATION_TTL:PT15M}
app.restaurant.inventory-expiry-delay-ms=${RESTAURANT_INVENTORY_EXPIRY_DELAY_MS:60000}
app.kafka.topics.order-created=${ORDER_CREATED_TOPIC:order.created}
app.kafka.topics.order-cancelled=${ORDER_CANCELLED_TOPIC:order.cancelled}
app.kafka.topics.refund-eligible=${ORDER_REFUND_ELIGIBLE_TOPIC:order.refund-eligible}
app.restaurant.inventory-consumer-enabled=${RESTAURANT_INVENTORY_CONSUMER_ENABLED:${RESTAURANT_INVENTORY_ENABLED:false}}
app.restaurant.inventory-consumer-group=${RESTAURANT_INVENTORY_CONSUMER_GROUP:restaurant-inventory-service-group}
app.kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.initial-delay-ms=${KAFKA_RETRY_INITIAL_DELAY_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${KAFKA_RETRY_MAX_DELAY_MS:10000}
app.kafka.retry.auto-create-topics=${KAFKA_RETRY_AUTO_CREATE_TOPICS:false}

# DataSource config
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=${RESTAURANT_DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${RESTAURANT_DB_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=restaurant-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Producer: serialize event object → JSON (dùng cho SearchSync + Restaurant order events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=${RESTAURANT_KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=${RESTAURANT_KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${RESTAURANT_KAFKA_DELIVERY_TIMEOUT_MS:10000}
app.kafka.topics.order-confirmed=${RESTAURANT_ORDER_CONFIRMED_TOPIC:restaurant.order-confirmed}
app.kafka.topics.order-rejected=${RESTAURANT_ORDER_REJECTED_TOPIC:restaurant.order-rejected}
