spring.application.name=user-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.port=8082
# Public password registration verifies Auth's signed provisioning JWT locally
# through JWKS. User has no Auth registration callback client.
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}
app.auth.jwks-uri=${AUTH_JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
app.jwt.issuer=${JWT_ISSUER:delivery-auth}
app.jwt.provisioning-audience=${JWT_PROVISIONING_AUDIENCE:delivery-user-registration}
app.identity.outbox.relay-enabled=${IDENTITY_OUTBOX_RELAY_ENABLED:false}
app.identity.kafka.retry.attempts=${IDENTITY_KAFKA_RETRY_ATTEMPTS:4}
app.identity.kafka.retry.initial-delay-ms=${IDENTITY_KAFKA_RETRY_INITIAL_DELAY_MS:1000}
app.identity.kafka.retry.multiplier=${IDENTITY_KAFKA_RETRY_MULTIPLIER:2.0}
app.identity.kafka.retry.max-delay-ms=${IDENTITY_KAFKA_RETRY_MAX_DELAY_MS:10000}
app.identity.kafka.retry.auto-create-topics=${IDENTITY_KAFKA_RETRY_AUTO_CREATE_TOPICS:false}
app.identity.outbox.poll-delay-ms=${IDENTITY_OUTBOX_POLL_DELAY_MS:1000}
app.identity.outbox.seed-poll-delay-ms=${IDENTITY_OUTBOX_SEED_POLL_DELAY_MS:1000}
app.identity.outbox.seed-batch-size=${IDENTITY_OUTBOX_SEED_BATCH_SIZE:100}
app.identity.events.enabled=${IDENTITY_EVENTS_ENABLED:false}
app.identity.topics.status-changed=${IDENTITY_STATUS_CHANGED_TOPIC:identity.status.changed}
app.identity.status-consumer-group=${IDENTITY_STATUS_CONSUMER_GROUP:user-identity-status-v1}

spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql=${HIBERNATE_BIND_LOG_LEVEL:INFO}
