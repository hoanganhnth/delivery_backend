{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "config-server",
    "labels": {
      "app.kubernetes.io/name": "config-server",
      "app.kubernetes.io/part-of": "delivery-platform",
      "app.kubernetes.io/component": "control-plane",
      "delivery.platform/template": "provider-neutral",
      "delivery.platform/wave": "control"
    }
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app.kubernetes.io/name": "config-server"
    },
    "ports": [
      {
        "name": "http",
        "port": 8888,
        "targetPort": "http",
        "protocol": "TCP"
      },
      {
        "name": "management",
        "port": 9090,
        "targetPort": "management",
        "protocol": "TCP"
      }
    ]
  }
}
