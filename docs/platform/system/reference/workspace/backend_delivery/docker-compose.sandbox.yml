# Production-like local sandbox overlay.
#
# This file is intentionally never included by the canonical Compose project.
# It removes fixed identities/ports, keeps every public binding on loopback,
# and turns on the matching/batch path for synthetic fixtures only. Use it
# together with docker-compose.isolated-e2e.yml and docker-compose.simulator.yml
# through scripts/sandbox-up.sh.
services:
  tracing-collector:
    ports: !reset []

  config-server:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m"

  discovery-server:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m"

  postgres:
    container_name: !reset null
    ports: !reset []

  redis:
    container_name: !reset null
    ports: !reset []

  kafka:
    container_name: !reset null
    ports: !reset []
    environment:
      # The sandbox starts the full production-shaped service graph inside the
      # 8 GB Docker Desktop cap. Keep Kafka's heap below its canonical local
      # value; production Compose remains unchanged.
      # Kafka's log cleaner needs more than the compact app heap during broker
      # bootstrap; keep the broker cgroup bounded while preserving that path.
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"

  elasticsearch:
    container_name: !reset null
    ports: !reset []
    # Synthetic sandbox data does not use ML. This keeps Elasticsearch below
    # the Docker Desktop cgroup limit while preserving the canonical Compose
    # heap and production-capacity contract.
    environment:
      ES_JAVA_OPTS: "-Xms96m -Xmx128m"
      xpack.ml.enabled: "false"
      xpack.monitoring.collection.enabled: "false"
      xpack.watcher.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
    deploy:
      resources:
        limits:
          memory: 1536M

  api-gateway:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"
    # Docker chooses a free host port; the launcher resolves it and writes it
    # to the run-scoped state file. Do not expose the Gateway on 0.0.0.0.
    ports: !override
      - "127.0.0.1::8079"

  auth-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  user-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  restaurant-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"
    deploy:
      resources:
        limits:
          memory: 768M

  order-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  delivery-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"
      # Batch support is enabled in the sandbox, but can be disabled for a
      # legacy single-offer comparison with SANDBOX_BATCH_ENABLED=false.
      DELIVERY_BATCH_ENABLED: "${SANDBOX_BATCH_ENABLED:-true}"

  search-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  shipper-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  settlement-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  notification-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"
    deploy:
      resources:
        limits:
          memory: 768M

  match-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"
      MATCHING_H3_ENABLED: "${SANDBOX_H3_ENABLED:-true}"
      MATCHING_BATCH_ENABLED: "${SANDBOX_BATCH_ENABLED:-true}"
      MATCHING_BATCH_SCHEDULER_ENABLED: "${SANDBOX_BATCH_SCHEDULER_ENABLED:-true}"
      MATCHING_BATCH_CANARY_PERCENT: "${SANDBOX_BATCH_CANARY_PERCENT:-100}"
      MATCHING_BATCH_CLIENT_CAPABILITY_REQUIRED: "${SANDBOX_BATCH_CLIENT_CAPABILITY_REQUIRED:-true}"
      # Keep active fairness routing off in the shared sandbox unless an
      # experiment explicitly opts in. This mirrors production's fail-closed
      # defaults while allowing scenario-lab proof with 100% canary.
      MATCHING_BALANCED_ETA_ENABLED: "${SANDBOX_BALANCED_ETA_ENABLED:-false}"
      MATCHING_BALANCED_ETA_CANARY_PERCENT: "${SANDBOX_BALANCED_ETA_CANARY_PERCENT:-0}"
      MATCHING_BALANCED_ETA_FAIRNESS_PENALTY_MINUTES: "${SANDBOX_BALANCED_ETA_FAIRNESS_PENALTY_MINUTES:-0.03}"
      MATCHING_BALANCED_ETA_SPEED_KM_PER_MINUTE: "${SANDBOX_BALANCED_ETA_SPEED_KM_PER_MINUTE:-0.5}"
    deploy:
      resources:
        limits:
          memory: 768M

  tracking-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  routing-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  saga-orchestrator-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"
      SAGA_FINDING_SHIPPER_TIMEOUT_MINUTES: "${SANDBOX_FINDING_SHIPPER_TIMEOUT_MINUTES:-1}"
      # The simulator/shipper contract supports the additive batch offer API.
      MATCHING_BATCH_CLIENT_CAPABILITY_ENABLED: "${SANDBOX_BATCH_CLIENT_CAPABILITY_ENABLED:-true}"

  livestream-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  promotion-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  analytics-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  flashsale-service:
    container_name: !reset null
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms48m"

  prometheus:
    container_name: !reset null
    ports: !override
      - "127.0.0.1::9090"

  grafana:
    container_name: !reset null
    ports: !override
      - "127.0.0.1::3000"

  simulator-service:
    container_name: !reset null
    ports: !override
      - "127.0.0.1::8100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://localhost:9100/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m"
      SIMULATOR_ENABLED: "true"
      SIMULATOR_ADMIN_ONLY: "true"
      SIMULATOR_API_TOKEN: "${SANDBOX_SIMULATOR_API_TOKEN:?SANDBOX_SIMULATOR_API_TOKEN must be set}"
      SIMULATOR_GATEWAY_BASE_URL: "http://api-gateway:8079"
      SIMULATOR_AUTH_BASE_URL: "http://auth-service:8081"
      SIMULATOR_MANAGED_ACTOR_POOL_REQUIRED: "true"
      SIMULATOR_ALLOWED_GATEWAY_HOSTS: "api-gateway"
      SIMULATOR_ALLOW_NON_LOCAL_TARGETS: "false"
      SIMULATOR_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:5174,http://127.0.0.1:5174"
      SIMULATOR_KAFKA_OBSERVER_ENABLED: "true"
      SIMULATOR_LEDGER_OBSERVER_ENABLED: "true"
      SIMULATOR_KAFKA_OBSERVER_GROUP_ID: "${SANDBOX_SIMULATOR_GROUP_ID:-sandbox-simulator-observer}"
      SIMULATOR_RUN_TIMEOUT_SECONDS: "${SANDBOX_RUN_TIMEOUT_SECONDS:-300}"
      SIMULATOR_MAX_ORDERS_PER_RUN: "${SANDBOX_MAX_ORDERS_PER_RUN:-20}"
      SIMULATOR_MOVEMENT_TICK_SECONDS: "${SANDBOX_MOVEMENT_TICK_SECONDS:-5}"
      SIMULATOR_HUMAN_ORDER_TIMEOUT_SECONDS: "${SANDBOX_HUMAN_ORDER_TIMEOUT_SECONDS:-180}"
      SIMULATOR_MAX_CONCURRENT_RUNS: "${SANDBOX_MAX_CONCURRENT_RUNS:-4}"
      MANAGEMENT_SERVER_PORT: "9100"

networks:
  delivery-network:
    name: "${SANDBOX_NETWORK_NAME:?SANDBOX_NETWORK_NAME must be set}"

volumes:
  postgres_data:
    name: "${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME must be set}"
  kafka_data:
    name: "${KAFKA_VOLUME_NAME:?KAFKA_VOLUME_NAME must be set}"
