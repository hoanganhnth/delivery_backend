# Local secret injection. The referenced files are operator-created and ignored;
# no key material is copied into an image, environment variable, or config repo.
services:
  api-gateway:
    environment:
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem

  auth-service:
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    secrets:
      - source: jwt-private-key
        target: jwt-private.pem
      - source: jwt-public-key
        target: jwt-public.pem

secrets:
  jwt-private-key:
    file: ${JWT_PRIVATE_KEY_FILE:?JWT_PRIVATE_KEY_FILE must point to an operator-owned PEM file}
  jwt-public-key:
    file: ${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE must point to an operator-owned PEM file}
