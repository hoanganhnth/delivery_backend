server.port=${SERVER_PORT:8091}
spring.application.name=web-bff-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/web_bff_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
web-bff.gateway-base-url=${WEB_BFF_GATEWAY_BASE_URL:http://api-gateway:8079}
web-bff.allowed-origins=${WEB_BFF_ALLOWED_ORIGINS:https://localhost:5173}
web-bff.encryption-key-version=${WEB_BFF_ENCRYPTION_KEY_VERSION:v1}
web-bff.encryption-key-base64=${WEB_BFF_ENCRYPTION_KEY_BASE64:}
web-bff.session-max-age-seconds=${WEB_BFF_SESSION_MAX_AGE_SECONDS:604800}
