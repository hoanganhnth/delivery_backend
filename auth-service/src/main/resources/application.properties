spring.application.name=auth-service
server.port=8081

# Custom config
# ⚠️ KHÔNG đặt secret thật ở đây. Cấu hình qua env INTERNAL_SECRET khi deploy.
# Chưa set → blank → endpoint nội bộ fail-closed. Xem SECURITY.md.
app.internal.secret=${INTERNAL_SECRET:}


# DataSource config
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


user-service.url=${USER_SERVICE_URL:http://localhost:8082}
user-service.internal-secret=${INTERNAL_SECRET:}
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}

# Explicit one-shot local/operator fixture for SHIPPER accounts. This is used by
# runtime harnesses after public SHIPPER self-registration was intentionally
# closed. Password is supplied only by env when the runner is enabled.
app.operator.shipper-provisioning.enabled=${APP_OPERATOR_SHIPPER_PROVISIONING_ENABLED:false}
app.operator.shipper-provisioning.email=${APP_OPERATOR_SHIPPER_PROVISIONING_EMAIL:}
app.operator.shipper-provisioning.password=${APP_OPERATOR_SHIPPER_PROVISIONING_PASSWORD:}
app.operator.shipper-provisioning.exit-after-run=${APP_OPERATOR_SHIPPER_PROVISIONING_EXIT_AFTER_RUN:false}

# Explicit one-shot local/operator fixture for ADMIN accounts. This remains
# isolated from public registration and is used only when an operator supplies
# the enable flag plus credentials via env.
app.operator.admin-provisioning.enabled=${APP_OPERATOR_ADMIN_PROVISIONING_ENABLED:false}
app.operator.admin-provisioning.email=${APP_OPERATOR_ADMIN_PROVISIONING_EMAIL:}
app.operator.admin-provisioning.password=${APP_OPERATOR_ADMIN_PROVISIONING_PASSWORD:}
app.operator.admin-provisioning.exit-after-run=${APP_OPERATOR_ADMIN_PROVISIONING_EXIT_AFTER_RUN:false}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

jwt.private-key.path=${JWT_PRIVATE_KEY_PATH:}
jwt.public-key.path=${JWT_PUBLIC_KEY_PATH:}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
