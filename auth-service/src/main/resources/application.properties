spring.application.name=auth-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.port=8081

# Custom config
# ⚠️ KHÔNG đặt secret thật ở đây. Cấu hình qua env INTERNAL_SECRET khi deploy.
# Chưa set → blank → endpoint nội bộ fail-closed. Xem SECURITY.md.
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}


# DataSource config
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


user-service.url=${USER_SERVICE_URL:http://user-service}
user-service.internal-secret=${internal-secret:${INTERNAL_SECRET:}}
user-service.timeout-ms=${USER_SERVICE_TIMEOUT_MS:2000}
user-service.circuit.failure-rate-threshold=${USER_SERVICE_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
user-service.circuit.sliding-window-size=${USER_SERVICE_CIRCUIT_SLIDING_WINDOW_SIZE:20}
user-service.circuit.wait-open-seconds=${USER_SERVICE_CIRCUIT_WAIT_OPEN_SECONDS:30}
user-service.circuit.permitted-half-open-calls=${USER_SERVICE_CIRCUIT_HALF_OPEN_CALLS:5}
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}

# Explicit one-shot local/operator fixture for SHIPPER accounts. This is used by
# runtime harnesses after public SHIPPER self-registration was intentionally
# closed. Password is supplied only by env when the runner is enabled.
app.operator.shipper-provisioning.enabled=${APP_OPERATOR_SHIPPER_PROVISIONING_ENABLED:false}
app.operator.shipper-provisioning.email=${APP_OPERATOR_SHIPPER_PROVISIONING_EMAIL:}
app.operator.shipper-provisioning.password=${APP_OPERATOR_SHIPPER_PROVISIONING_PASSWORD:}
app.operator.shipper-provisioning.exit-after-run=${APP_OPERATOR_SHIPPER_PROVISIONING_EXIT_AFTER_RUN:false}

# Explicit one-shot local/operator fixture for ADMIN accounts. This remains
# isolated from public registration and is used only when an operator supplies
# the enable flag plus credentials via env.
app.operator.admin-provisioning.enabled=${APP_OPERATOR_ADMIN_PROVISIONING_ENABLED:false}
app.operator.admin-provisioning.email=${APP_OPERATOR_ADMIN_PROVISIONING_EMAIL:}
app.operator.admin-provisioning.password=${APP_OPERATOR_ADMIN_PROVISIONING_PASSWORD:}
app.operator.admin-provisioning.exit-after-run=${APP_OPERATOR_ADMIN_PROVISIONING_EXIT_AFTER_RUN:false}

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

jwt.private-key.path=${JWT_PRIVATE_KEY_PATH:}
jwt.public-key.path=${JWT_PUBLIC_KEY_PATH:}
jwt.previous-public-key.path=${JWT_PREVIOUS_PUBLIC_KEY_PATH:}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
