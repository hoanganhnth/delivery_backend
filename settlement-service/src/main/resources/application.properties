spring.application.name=settlement-service
app.payment.processing-enabled=${PAYMENT_PROCESSING_ENABLED:false}
app.payment.fake-provider-enabled=${FAKE_PAYMENT_PROVIDER_ENABLED:false}
app.settlement.self-service-api-enabled=${SETTLEMENT_SELF_SERVICE_API_ENABLED:false}
app.settlement.admin-mutation-api-enabled=${SETTLEMENT_ADMIN_MUTATION_API_ENABLED:false}

server.port=8090
app.internal.secret=${INTERNAL_SECRET:}

# DataSource config
spring.datasource.url=jdbc:postgresql://localhost:5432/settlement_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=settlement-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
app.kafka.topics.delivery-completed=${SETTLEMENT_DELIVERY_COMPLETED_TOPIC:delivery.completed}

# Logging
logging.level.com.delivery.settlement_service=INFO
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka=ERROR

# ═══════════════════════════════════════════
# Payment Gateway Configuration
# ═══════════════════════════════════════════

# General
payment.default-provider=${PAYMENT_DEFAULT_PROVIDER:VNPAY}
payment.order-expiry-minutes=15

# VNPay Sandbox
# Đăng ký tại: https://sandbox.vnpayment.vn
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8090/api/settlement/payments/vnpay-callback}
